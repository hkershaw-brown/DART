[build-system]
requires = ["setuptools>=65.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "wrf-dart"
version = "1.0.0"
description = "Modern Python implementation of WRF-DART ensemble data assimilation"
readme = "README.md"
requires-python = ">=3.9"
license = {text = "UCAR"}
authors = [
    {name = "Helen Kershaw", email = "hkershaw@ucar.edu"}
]
keywords = ["data-assimilation", "ensemble", "wrf", "dart", "meteorology"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
]

dependencies = [
    "pyyaml>=6.0",
    "netCDF4>=1.6.0",
    "numpy>=1.24.0",
    "jsonschema>=4.17.0",
    "python-dateutil>=2.8.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "pytest-cov>=4.0",
    "pytest-mock>=3.10",
    "black>=23.0",
    "mypy>=1.0",
    "pylint>=2.16",
]

[project.scripts]
wrf-dart-cycle = "wrf_dart.scripts.run_cycle:main"
wrf-dart-chain = "wrf_dart.scripts.submit_cycle_chain:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = "test_*.py"
python_classes = "Test*"
python_functions = "test_*"
addopts = "-v --tb=short"

[tool.black]
line-length = 100
target-version = ["py39", "py310", "py311"]
include = '\.pyi?$'

[tool.mypy]
python_version = "3.9"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
ignore_missing_imports = true

[tool.pylint.messages_control]
max-line-length = 100
disable = [
    "C0103",  # Invalid name
    "R0913",  # Too many arguments
]
